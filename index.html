<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>RICO — Enter The Pond</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="experience">

    <!-- OPENING -->
    <section class="intro" id="intro">
      <div class="grain"></div>

      <div class="intro-content">
        <div class="duck-badge">🦆</div>

        <p class="eyebrow">RICO HAS ARRIVED</p>

        <h1>LET RICO<br><span>COOK.</span></h1>

        <p class="sub">
          One tap. One ride.<br>
          Unlimited flex.
        </p>

        <button id="startBtn">
          <span>WATCH RICO COOK</span>
          <b>→</b>
        </button>

        <small>🔊 SOUND ON</small>
      </div>
    </section>


    <!-- ANIMATION -->
    <section class="scene" id="scene">

      <div class="scene-light"></div>

      <div class="moon"></div>

      <!-- Background -->
      <div class="city">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
      </div>

      <!-- Ground -->
      <div class="ground"></div>

      <!-- Money particles -->
      <div class="money-container" id="moneyContainer"></div>

      <!-- Car -->
      <div class="car" id="car">

        <div class="car-glow"></div>

        <div class="car-body">

          <div class="windshield"></div>

          <div class="roof"></div>

          <div class="door" id="door"></div>

          <div class="headlight left"></div>
          <div class="headlight right"></div>

          <div class="wheel left"></div>
          <div class="wheel right"></div>

          <div class="car-front"></div>

        </div>

      </div>

      <!-- RICO -->
      <div class="rico" id="rico">

        <div class="chain chain-one"></div>
        <div class="chain chain-two"></div>

        <div class="watch"></div>

        <div class="duck">

          <div class="duck-body"></div>

          <div class="duck-head">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="beak"></div>
            <div class="cap"></div>
          </div>

          <div class="wing left"></div>
          <div class="wing right"></div>

          <div class="foot left"></div>
          <div class="foot right"></div>

        </div>

      </div>

      <!-- Final message -->
      <div class="final-message" id="finalMessage">

        <p>THE MARKET DOESN'T MOVE RICO.</p>

        <h2>
          RICO MOVES<br>
          THE MARKET.
        </h2>

        <button id="replayBtn">
          REPLAY ↻
        </button>

      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
