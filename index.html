<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>RICO — Enter The Pond</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app">

  <!-- =========================
       INTRO
  ========================== -->

  <section class="intro" id="intro">

    <div class="noise"></div>

    <div class="intro-glow"></div>

    <div class="intro-content">

      <div class="rico-mark">
        🦆
      </div>

      <p class="kicker">
        RICO MEME CONTEST
      </p>

      <h1>
        LET RICO<br>
        <span>COOK.</span>
      </h1>

      <p class="intro-copy">
        One tap.<br>
        One ridiculous entrance.
      </p>

      <button id="startBtn">
        <span>WATCH RICO COOK</span>
        <strong>↗</strong>
      </button>

      <div class="sound-hint">
        <span class="sound-dot"></span>
        SOUND ON
      </div>

    </div>

  </section>


  <!-- =========================
       CINEMATIC SCENE
  ========================== -->

  <section class="scene" id="scene">

    <div class="vignette"></div>

    <div class="sky-glow"></div>

    <div class="moon"></div>

    <!-- CITY -->

    <div class="city">

      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </div>


    <!-- LIGHT BEAMS -->

    <div class="light-beam beam-left"></div>
    <div class="light-beam beam-right"></div>


    <!-- GROUND -->

    <div class="ground">

      <div class="road-lines"></div>

    </div>


    <!-- CAMERA -->

    <div class="camera" id="camera">

      <!-- =========================
           LAMBORGHINI
      ========================== -->

      <div class="car" id="car">

        <div class="car-shadow"></div>

        <div class="car-body">

          <div class="car-window"></div>

          <div class="car-roof"></div>

          <div class="car-door" id="carDoor"></div>

          <div class="car-handle"></div>

          <div class="headlight headlight-left"></div>
          <div class="headlight headlight-right"></div>

          <div class="wheel wheel-left"></div>
          <div class="wheel wheel-right"></div>

          <div class="car-front"></div>

        </div>

      </div>


      <!-- =========================
           RICO
      ========================== -->

      <div class="rico" id="rico">

        <!-- Replace these later with actual transparent assets -->

        <div class="rico-chain chain-back"></div>
        <div class="rico-chain chain-front"></div>

        <div class="rico-watch"></div>

        <div class="duck">

          <div class="duck-head">

            <div class="duck-eye eye-left"></div>
            <div class="duck-eye eye-right"></div>

            <div class="duck-beak"></div>

            <div class="duck-cap"></div>

          </div>

          <div class="duck-body"></div>

          <div class="duck-wing wing-left"></div>
          <div class="duck-wing wing-right"></div>

          <div class="duck-foot foot-left"></div>
          <div class="duck-foot foot-right"></div>

        </div>

      </div>


      <!-- =========================
           MONEY
      ========================== -->

      <div class="money-layer" id="moneyLayer"></div>


      <!-- =========================
           FINAL FRAME
      ========================== -->

      <div class="final" id="final">

        <div class="final-inner">

          <p>
            THE MARKET DOESN'T MOVE RICO.
          </p>

          <h2>
            RICO MOVES<br>
            <span>THE MARKET.</span>
          </h2>

          <button id="replayBtn">
            REPLAY ↻
          </button>

        </div>

      </div>

    </div>

  </section>

</main>

<script src="script.js"></script>

</body>
</html>
