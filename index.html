<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RICO — Let RICO Cook</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app">

    <!-- INTRO -->
    <section id="intro" class="intro">
      <div class="intro-glow"></div>

      <div class="rico-mark">🦆</div>

      <p class="eyebrow">RICO MEME CONTEST</p>

      <h1>LET RICO<br><span>COOK.</span></h1>

      <p class="intro-copy">
        One tap.<br>
        One ridiculous entrance.
      </p>

      <button id="startBtn">
        WATCH RICO COOK
        <span>↗</span>
      </button>

      <div class="sound-status">● SOUND ON</div>
    </section>


    <!-- CINEMATIC SCENE -->
    <section id="scene">

      <div class="sky"></div>
      <div class="moon"></div>

      <div class="city city-back"></div>
      <div class="city city-front"></div>

      <div class="light-beam beam-one"></div>
      <div class="light-beam beam-two"></div>

      <div class="atmosphere">
        <i></i><i></i><i></i><i></i><i></i>
      </div>

      <div id="camera">

        <div class="road">
          <div class="road-line line-one"></div>
          <div class="road-line line-two"></div>
        </div>

        <!-- CAR -->
        <div id="car">

          <div class="car-shadow"></div>

          <div class="car-body">
            <div class="car-roof"></div>
            <div class="car-window"></div>

            <div class="headlight left-light"></div>
            <div class="headlight right-light"></div>

            <div class="wheel wheel-left"></div>
            <div class="wheel wheel-right"></div>

            <div class="door">
              <span></span>
            </div>

            <div class="hood"></div>
          </div>

        </div>


        <!-- RICO -->
        <div id="rico">

          <div class="rico-shadow"></div>

          <div class="rico-body">
            <div class="rico-head">
              <div class="rico-eye eye-one"></div>
              <div class="rico-eye eye-two"></div>
              <div class="rico-beak"></div>
              <div class="rico-cap"></div>
            </div>

            <div class="rico-necklace necklace-one"></div>
            <div class="rico-necklace necklace-two"></div>

            <div class="rico-watch"></div>

            <div class="rico-arm arm-one"></div>
            <div class="rico-arm arm-two"></div>

            <div class="rico-leg leg-one"></div>
            <div class="rico-leg leg-two"></div>
          </div>

        </div>


        <!-- MONEY -->
        <div id="money"></div>

        <!-- SMOKE -->
        <div id="smoke">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>


      <div class="scene-caption">
        <span>RICO HAS ARRIVED</span>
      </div>

      <div id="finalMessage">
        <small>THE MARKET DOESN'T MOVE RICO.</small>
        <strong>RICO MOVES<br>THE MARKET.</strong>
      </div>

      <button id="replay">↻ REPLAY</button>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
