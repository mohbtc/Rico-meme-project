<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RICO — Let RICO Cook</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app">

  <section id="intro" class="intro">
    <div class="intro-noise"></div>

    <div class="rico-logo">R</div>

    <div class="eyebrow">RICO MEME CONTEST</div>

    <h1>LET RICO<br><span>COOK.</span></h1>

    <p>
      One tap.<br>
      One ridiculous entrance.
    </p>

    <button id="startBtn">
      WATCH RICO COOK
      <b>↗</b>
    </button>

    <div class="sound">● SOUND ON</div>
  </section>


  <section id="scene">

    <div class="sky"></div>
    <div class="orange-glow"></div>
    <div class="moon"></div>

    <div class="city back"></div>
    <div class="city front"></div>

    <div class="headlight-beam beam-left"></div>
    <div class="headlight-beam beam-right"></div>

    <div class="particles">
      <i></i><i></i><i></i><i></i><i></i>
      <i></i><i></i><i></i>
    </div>

    <div id="camera">

      <div class="road">
        <div class="reflection reflection-one"></div>
        <div class="reflection reflection-two"></div>
        <div class="road-mark mark-one"></div>
        <div class="road-mark mark-two"></div>
      </div>


      <!-- CAR -->

      <div id="car">

        <div class="car-shadow"></div>

        <div class="car-body">

          <div class="car-roof"></div>
          <div class="car-glass"></div>

          <div class="car-line"></div>

          <div class="headlight hl-left"></div>
          <div class="headlight hl-right"></div>

          <div class="door">
            <span></span>
          </div>

          <div class="hood"></div>

          <div class="wheel wheel-left">
            <div></div>
          </div>

          <div class="wheel wheel-right">
            <div></div>
          </div>

        </div>
      </div>


      <!-- RICO PLACEHOLDER -->

      <div id="rico">

        <div class="rico-shadow"></div>

        <div class="rico-character">

          <div class="rico-head">
            <div class="cap"></div>
            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>
            <div class="beak"></div>
          </div>

          <div class="chain chain-one"></div>
          <div class="chain chain-two"></div>

          <div class="rico-body"></div>

          <div class="arm arm-left"></div>
          <div class="arm arm-right"></div>

          <div class="watch"></div>

          <div class="leg leg-left"></div>
          <div class="leg leg-right"></div>

        </div>

      </div>


      <!-- SMOKE -->

      <div id="smoke">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>


      <!-- MONEY -->

      <div id="money"></div>

    </div>


    <div class="arrival">
      RICO HAS ARRIVED
    </div>


    <div id="finalMessage">
      <small>THE MARKET DOESN'T MOVE RICO.</small>
      <strong>RICO MOVES<br>THE MARKET.</strong>
    </div>


    <button id="replay">↻ REPLAY</button>

  </section>

</main>

<script src="script.js"></script>

</body>
</html>
